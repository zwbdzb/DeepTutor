# ThinkBuddy Desktop 打包流水线（Windows + macOS）
#
# Windows 与本地 desktop-shell\build\build.ps1 完全等价的三步：
#   1. 前端 standalone 构建 + prepare_web_package.py -> deeptutor_web/
#   2. build_runtime.py -> runtime-build/staging (embeddable Python + deeptutor 源码 + Node 22)
#   3. PyInstaller -> dist\ThinkBuddyDesktop.exe；Inno Setup -> dist\ThinkBuddySetup.exe
#
# macOS（arm64 + x86_64）平行流程，同样是三步：
#   1. 前端 standalone 构建 + prepare_web_package.py -> deeptutor_web/
#   2. build_runtime.py --arch <arm64|x86_64> -> runtime-build/staging (python-build-standalone + deeptutor 源码 + Node 22)
#   3. PyInstaller -> dist/ThinkBuddyDesktop.app；ditto -> dist/ThinkBuddyDesktop-mac-<arch>.zip
#
# 触发：
#   - push 到 main/dev 且改动涉及 desktop-shell/**、web/**、deeptutor/** 等打包输入
#   - 手动 workflow_dispatch（可勾选 release 额外发布 GitHub Release）
#
# macOS MVP 阶段不做 codesigning：用户首次打开需右键 → 打开 → 仍要打开 绕过 Gatekeeper。
# 后续接 APPLE_DEVELOPER_ID secrets + codesign --deep + notarytool。
name: ThinkBuddy Desktop Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "构建成功后发布 GitHub Release（desktop-N tag 附两个 exe，desktop-mac-N tag 附 arm64 + x86_64 两个 zip）"
        type: boolean
        default: false
  push:
    branches: [main, develop]
    paths:
      - "desktop-shell/**"
      - "web/**"
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "scripts/prepare_web_package.py"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows · runtime + exe + installer
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cp312 wheel 解析器：build_runtime.py 通过 BUILD_PY 找到它，
      # 把依赖 wheel 安装进 embeddable 运行时（构建期用，不随包分发）。
      - name: Set up Python 3.12 (BUILD_PY)
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22 (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 缓存 build_runtime.py 下载的 python-3.12.7-embed + node zip（约 60MB）。
      # build_runtime.py 里的 PY_VER / NODE_VER 变了记得同步 bump 这个 key。
      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: desktop-shell/runtime-build/cache
          key: edubuddy-runtime-dl-py3127-node2222

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      # Windows 上 subprocess 解析不了 npm.cmd，所以先在 shell 里构建前端，
      # 再用 --skip-build 让脚本只做拷贝（校验 web/.next/standalone/server.js）。
      - name: Build frontend (Next.js standalone)
        working-directory: web
        run: npm run build

      - name: Refresh deeptutor_web package
        run: python scripts/prepare_web_package.py --skip-build

      # build.ps1 硬性要求 desktop-shell\.venv 存在（pywebview/pillow/pyinstaller）。
      - name: Create shell venv
        working-directory: desktop-shell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install pywebview pillow pyinstaller

      # choco 提供的是 Inno Setup 6（>=6.3），installer.iss 的语法全部兼容，
      # build.ps1 会自动探测 ISCC.exe 的安装路径。
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # choco 静默安装不含各语种 .isl（交互式安装时才勾选语言组件），
      # installer.ss 需要 ChineseSimplified.isl，从官方 issrc 仓库补到 Languages 目录。
      - name: Add Chinese (Simplified) language file
        run: |
          $islDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$islDir\ChineseSimplified.isl"

      - name: Build runtime + exe + installer
        working-directory: desktop-shell
        env:
          BUILD_PY: ${{ steps.py312.outputs.python-path }}
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - name: List outputs
        working-directory: desktop-shell
        run: Get-ChildItem dist -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload desktop exe
        uses: actions/upload-artifact@v4
        with:
          name: ThinkBuddyDesktop-windows
          path: desktop-shell/dist/ThinkBuddyDesktop.exe
          if-no-files-found: error

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: ThinkBuddySetup-windows
          path: desktop-shell/dist/ThinkBuddySetup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: ThinkBuddy Desktop build ${{ github.run_number }}
          files: |
            desktop-shell/dist/ThinkBuddyDesktop.exe
            desktop-shell/dist/ThinkBuddySetup.exe

  mac:
    name: macOS ${{ matrix.arch }} · runtime + app + zip
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cp312 解释器：build_runtime.py 通过 BUILD_PY 找到它，把依赖 wheel
      # 安装进 staging 的 python-build-standalone 运行时（构建期用，不随包分发）。
      - name: Set up Python 3.12 (BUILD_PY)
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22 (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 缓存 build_runtime.py 下载的 python-build-standalone tarball + node darwin tarball（约 80MB）。
      # key 含 arch：arm64 和 x86_64 下载的 tarball 不同，缓存不能混用。
      # build_runtime.py 里的 PY_VER / NODE_VER 变了记得同步 bump 这个 key。
      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: desktop-shell/runtime-build/cache
          key: thinkbuddy-runtime-mac-${{ matrix.arch }}-py3127-node2222

      # 从 icon.png 生成 .icns（macOS 自带 sips + iconutil，无需额外依赖）。
      # spec 引用 assets/icon.icns；本地开发可手动跑同样命令生成后签入。
      - name: Generate .icns from icon.png
        run: |
          set -e
          ICONSET=/tmp/icon.iconset
          SRC=desktop-shell/assets/icon.png
          mkdir -p "$ICONSET"
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"        > /dev/null
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"    > /dev/null
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"        > /dev/null
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"    > /dev/null
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"      > /dev/null
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"  > /dev/null
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"      > /dev/null
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"  > /dev/null
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"      > /dev/null
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"  > /dev/null
          iconutil -c icns "$ICONSET" -o desktop-shell/assets/icon.icns

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      # macOS 上 subprocess 能直接解析 npm，所以构建 + 拷贝可走一条命令；
      # prepare_web_package.py --skip-build 让脚本只做拷贝（校验 web/.next/standalone/server.js）。
      - name: Build frontend (Next.js standalone)
        working-directory: web
        run: npm run build

      - name: Refresh deeptutor_web package
        run: python scripts/prepare_web_package.py --skip-build

      # build_runtime.py 的硬性要求：desktop-shell/.venv 存在（pywebview/pillow/pyinstaller）。
      - name: Create shell venv
        working-directory: desktop-shell
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install pywebview pillow pyinstaller

      # build_runtime.py --arch：下载对应架构的 python-build-standalone + node darwin tarball。
      # **不带** --no-zip：mac 没有安装器（无 Inno），runtime.zip 必须内嵌进 .app，
      # shell 首启自解压到 ~/Library/Application Support/ThinkBuddy/runtime/。
      - name: Build runtime + zip
        working-directory: desktop-shell
        env:
          BUILD_PY: ${{ steps.py312.outputs.python-path }}
        run: .venv/bin/python tools/build_runtime.py --arch ${{ matrix.arch }}

      # 只重写 staging 产物里的用户可见品牌名；包名/类名/URL 受保护。幂等。
      - name: Rebrand staging (DeepTutor -> ThinkBuddy)
        working-directory: desktop-shell
        run: .venv/bin/python tools/rebrand.py

      - name: Build .app with PyInstaller
        working-directory: desktop-shell
        run: .venv/bin/python -m PyInstaller --noconfirm --clean build/ThinkBuddyDesktop-mac.spec

      # ditto 保留 mac 元数据（权限/符号链接/扩展属性），比 zip 更适合 .app 打包。
      - name: Zip .app bundle
        working-directory: desktop-shell/dist
        run: ditto -c -k --keepParent ThinkBuddyDesktop.app ThinkBuddyDesktop-mac-${{ matrix.arch }}.zip

      - name: List outputs
        working-directory: desktop-shell
        run: ls -lh dist/ThinkBuddyDesktop-mac-${{ matrix.arch }}.zip

      - name: Upload mac zip
        uses: actions/upload-artifact@v4
        with:
          name: ThinkBuddyDesktop-mac-${{ matrix.arch }}
          path: desktop-shell/dist/ThinkBuddyDesktop-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-mac-${{ github.run_number }}
          name: ThinkBuddy Desktop (macOS) build ${{ github.run_number }}
          body: |
            ## macOS ${{ matrix.arch }} 构建

            **首次打开方式**（未签名应用绕过 Gatekeeper）：
            1. 下载并解压 `ThinkBuddyDesktop-mac-${{ matrix.arch }}.zip`
            2. 在 Finder 里找到 `ThinkBuddyDesktop.app`
            3. **右键** → 「打开」→ 弹窗点「仍要打开」
            4. 之后双击即可正常启动

            首次启动会自解压运行时（python + node），可能需要 10-30 秒。
          files: |
            desktop-shell/dist/ThinkBuddyDesktop-mac-${{ matrix.arch }}.zip
