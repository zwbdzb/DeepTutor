# ThinkBuddy Android 打包流水线（完全离线版）
#
# 产物：一个自带引擎的 APK（≈1GB）。运行时 zip（Debian arm64 rootfs + python +
# node + PRoot）被放进 app/src/main/assets/，首次启动从 assets 解压到 App 沙盒，
# 之后完全离线可用，不需要手填任何下载地址。
#
# 为什么以前是「首次下载」：1GB 运行时超过 GitHub artifact 的配额，只能发 release
# 资产再让 App 下载；现在直接塞进 APK（release 资产单文件上限 2GB），代价是 APK
# 很大、每次升级都要重下整包。
#
# 单 job 结构：runtime 构建与 Gradle 打包放在同一个 job 里，避免在 job 之间搬运
# 1GB 的文件（artifact 有配额限制，cache 中转也很慢）。
#   push 到 feat-phone：构建运行时 + 离线 APK（产物在本次 run 的 Artifacts 里，不发 release）
#   push 到 main/dev*：只验证 aarch64 运行时能构建，不出 APK
#   workflow_dispatch：同上，可勾选 release 决定是否额外发布到 release android-N
name: ThinkBuddy Android Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "构建成功后发布 GitHub Release（android-N tag：APK + 运行时 zip）"
        type: boolean
        default: false
      skip_apk:
        description: "只构建运行时 bundle，跳过 APK"
        type: boolean
        default: false
  push:
    # feat-phone：手机端开发分支。默认分支 develop 上还没有本工作流，
    # GitHub 侧边栏不会列出它（也就没有 Run workflow 按钮），所以需要
    # 靠 push 触发；合并进默认分支后会自动出现在侧边栏。
    branches: [main, "dev**", "feat-phone"]
    paths:
      - "apps/android/**"
      - "desktop-shell/tools/build_runtime.py"
      - "desktop-shell/tools/build_android_bundle.py"
      - "desktop-shell/tools/rebrand.py"
      - "web/**"
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "scripts/prepare_web_package.py"
      - "pyproject.toml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  android:
    name: Android · offline runtime + APK
    runs-on: ubuntu-24.04
    env:
      PYTHONIOENCODING: utf-8
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # dispatch 才出 APK；push 到开发分支 feat-phone 也出（默认分支还没有本
      # 工作流时，UI 里没有 Run workflow 按钮，只能靠 push 拿到离线 APK）。
      BUILD_APK: ${{ (github.event_name == 'workflow_dispatch' && !inputs.skip_apk) || github.ref_name == 'feat-phone' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: next-web-

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Build frontend (Next.js standalone)
        working-directory: web
        run: npm run build

      - name: Set up Python 3.12 (BUILD_PY)
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 本地 deeptutor-* 模块 wheel 与 pyproject build-system 都需要 setuptools。
      - name: Install build tooling
        run: python -m pip install --upgrade setuptools wheel

      - name: Refresh deeptutor_web package
        run: python scripts/prepare_web_package.py --skip-build

      # 缓存 staging 树 + 下载缓存：手机运行时依赖集合很大，缓存能把只改源码的
      # 构建从十几分钟压到几分钟。
      - name: Cache runtime tree
        uses: actions/cache@v4
        with:
          path: desktop-shell/runtime-build
          key: thinkbuddy-runtime-android-arm64-py3127-node2222-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            thinkbuddy-runtime-android-arm64-py3127-node2222-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-android-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-android-

      - name: Build runtime (linux-aarch64)
        working-directory: desktop-shell
        env:
          BUILD_PY: ${{ steps.py312.outputs.python-path }}
          PIP_INDEX_URL: https://pypi.org/simple
        run: python tools/build_runtime.py --target android-arm64

      # PRoot + Debian rootfs 与运行时合并成一个 zip（rebrand 已在 build_runtime
      # 的 zip 前完成，zip 内的品牌已是 ThinkBuddy）。
      - name: Assemble Android runtime bundle
        working-directory: desktop-shell
        run: python tools/build_android_bundle.py

      - name: Read runtime info
        id: info
        working-directory: desktop-shell
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' ../deeptutor/__version__.py | head -n1)
          SHA=$(sha256sum dist/ThinkBuddy-android-runtime-arm64.zip | cut -d' ' -f1)
          SIZE=$(stat -c%s dist/ThinkBuddy-android-runtime-arm64.zip)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "runtime $VERSION sha256=$SHA size=$((SIZE / 1000000))MB"
          {
            echo "### Android runtime"
            echo "- version: \`$VERSION\`"
            echo "- size: $((SIZE / 1000000)) MB"
            echo "- sha256: \`$SHA\`"
            echo "- 打包方式: 内置进 APK assets（离线，首次启动解压）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        if: env.BUILD_APK == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-24.04 runner 自带 Android SDK（ANDROID_HOME 已预设）。
      # 不用 android-actions/setup-android@v3：它会去装已下架的 legacy "tools"
      # 包，在新版 cmdline-tools 上直接报 "Failed to find package 'tools'"。
      - name: Install Android SDK packages
        if: env.BUILD_APK == 'true'
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            # 镜像里可能叫 cmdline-tools/16.0 而不是 latest；按版本号取最新的一个。
            SDKMANAGER="$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        if: env.BUILD_APK == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore (optional)
        if: env.BUILD_APK == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thinkbuddy.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/thinkbuddy.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # 离线分发的关键一步：把运行时 zip 放进 assets，Gradle 会自动检测到并
      # 把 BuildConfig.BUNDLED_RUNTIME 置为 true。
      - name: Bundle runtime into APK assets
        if: env.BUILD_APK == 'true'
        run: |
          mkdir -p apps/android/app/src/main/assets
          cp desktop-shell/dist/ThinkBuddy-android-runtime-arm64.zip \
             apps/android/app/src/main/assets/thinkbuddy-runtime.zip
          ls -lh apps/android/app/src/main/assets

      - name: Build APK
        if: env.BUILD_APK == 'true'
        working-directory: apps/android
        env:
          ENGINE_VERSION: ${{ steps.info.outputs.version }}
        run: |
          TASK=:app:assembleDebug
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASK=:app:assembleRelease; fi
          gradle "$TASK" --no-daemon \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$ENGINE_VERSION" \
            -PengineVersion="$ENGINE_VERSION"

      - name: Collect APK
        if: env.BUILD_APK == 'true'
        run: |
          mkdir -p out
          find apps/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out
          for f in *.apk; do mv "$f" "ThinkBuddy-android-${f}"; done
          ls -lh
          {
            echo "### Android APK"
            echo "- 自带运行时：是（assets 内置，离线可跑）"
            echo "- 大小：$(du -h ThinkBuddy-android-*.apk | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 1GB 级别的 APK 不走 release 时放进 Actions Artifacts（公开仓库的
      # artifact 存储免费）；勾选 release 才额外发到 release 页面。
      - name: Upload APK artifact
        if: env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ThinkBuddy-android-apk
          path: out/*.apk
          retention-days: 7
          compression-level: 0

      - name: Publish to GitHub Release
        if: env.BUILD_APK == 'true' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: ThinkBuddy Android build ${{ github.run_number }}
          append_body: true
          fail_on_unmatched_files: false
          body: |
            ## Android（完全离线包）
            - `ThinkBuddy-android-*.apk` — 自带引擎（python + node + Debian rootfs + PRoot），首次启动解压后完全离线可用
            - `ThinkBuddy-android-runtime-arm64.zip` — 同一份运行时，单独分发（供调试/手动安装）
            - 安装后首次启动需要约 2 分钟释放运行时；需要 ~3GB 可用空间
            - 重能力（deep_research 全文解析 / math_animator / video_lesson）可在设置里切到「远程引擎」，SSH 连接电脑上的 `deeptutor start`
          files: |
            desktop-shell/dist/ThinkBuddy-android-runtime-arm64.zip
            out/*.apk
